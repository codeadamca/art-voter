<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Voter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">🎨 Art Voter</h1>
            <div class="nav-buttons">
                <button class="nav-btn active" id="viewBtn" onclick="showPage('view')">View & Vote</button>
                <button class="nav-btn" id="uploadBtn" onclick="showPage('upload')">Upload Art</button>
            </div>
        </div>
    </nav>

    <!-- View & Vote Page -->
    <div id="viewPage" class="page active">
        <div class="container">
            <div class="view-header">
                <h2>Vote on Art Pieces</h2>
                <div class="admin-buttons">
                    <button class="btn-admin" id="resetVotesBtn" onclick="resetAllVotes()">🔄 Reset All Votes</button>
                    <button class="btn-admin btn-danger" id="deleteAllBtn" onclick="deleteAllArt()">🗑️ Delete All Art</button>
                </div>
            </div>
            <div id="artGallery" class="gallery">
                <p class="loading">Loading art pieces...</p>
            </div>
        </div>
    </div>

    <!-- Upload Page -->
    <div id="uploadPage" class="page">
        <div class="container">
            <h2>Upload Your Art</h2>
            <div class="upload-container">
                <form id="uploadForm" class="upload-form">
                    <div class="form-group">
                        <label for="artName">Art Piece Name:</label>
                        <input type="text" id="artName" required placeholder="Enter the name of your art piece">
                    </div>
                    
                    <div class="form-group">
                        <label for="artImage">Select Image:</label>
                        <input type="file" id="artImage" accept="image/*" required>
                        <p class="helper-text">Supported formats: JPG, PNG, GIF, WebP</p>
                    </div>

                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <p>Preview:</p>
                        <img id="previewImage" alt="Preview">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Upload Art</button>
                    <p class="upload-status" id="uploadStatus"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Art Card Template (hidden) -->
    <template id="artCardTemplate">
        <div class="art-card">
            <img class="art-image" alt="Art piece">
            <h3 class="art-name"></h3>
            <div class="art-footer">
                <div class="vote-count">
                    <span class="vote-number">0</span> votes
                </div>
                <button class="btn-vote">👍 Vote</button>
            </div>
        </div>
    </template>

    <!-- Firebase SDKs (v8 - compatible with vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
