<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Voter</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

    <div class="container">
        <header>
            <h1>🎨 Art Voter</h1>
            <p>Vote on amazing art pieces</p>
        </header>

        <div class="controls">
            <button class="btn-primary" id="homeBtn">Home</button>
            <button class="btn-secondary" id="uploadBtn">Upload Art</button>
            <button class="btn-danger" id="resetVotesBtn">Reset Votes</button>
            <button class="btn-danger" id="resetAllBtn">Reset All</button>
        </div>

        <!-- Home Page -->
        <div id="homePage">
            <div id="artGrid" class="art-grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                No art pieces yet. Be the first to upload!
            </div>
        </div>

        <!-- Image Lightbox Modal -->
        <div id="imageModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <img id="modalImage" src="" alt="Full size art">
            </div>
        </div>

        <!-- Upload Page -->
        <div id="uploadPage">
            <div class="upload-container">
                <h2>Upload Your Art</h2>
                <div id="uploadMessage"></div>
                
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="artName">Art Name *</label>
                        <input type="text" id="artName" placeholder="Enter art name" required>
                    </div>

                    <div class="form-group">
                        <label for="artImage">Image *</label>
                        <input type="file" id="artImage" accept="image/*" required>
                        <img id="imagePreview" class="preview-image" style="display: none;">
                    </div>

                    <div class="form-buttons">
                        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-primary" id="submitBtn">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- Firebase SDK from Google CDN (v12.18.0)    -->
    <!-- Using compat version for .ref() support    -->
    <!-- ============================================ -->
    <!-- Core Firebase App Library -->
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    
    <!-- Firebase Services (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

    <!-- Local Configuration and App Logic -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>

</body>
</html>
