<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Voter - Vote on the Best Art</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">🎨 Art Voter</h1>
            <div class="nav-links">
                <button class="nav-btn active" id="homeBtn">Home</button>
                <button class="nav-btn" id="uploadBtn">Upload Art</button>
            </div>
        </div>
    </nav>

    <!-- Home Page -->
    <section id="homePage" class="page active">
        <div class="container">
            <h2>Vote on Art</h2>
            <div class="admin-buttons">
                <button class="admin-btn clear-votes-btn">Clear All Votes</button>
                <button class="admin-btn clear-all-btn">Clear All Data</button>
            </div>
            <div id="artGallery" class="gallery">
                <p class="loading">Loading art pieces...</p>
            </div>
        </div>
    </section>

    <!-- Upload Page -->
    <section id="uploadPage" class="page">
        <div class="container">
            <h2>Upload Your Art</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="artTitle">Art Title</label>
                    <input type="text" id="artTitle" placeholder="Enter the title of your art" required>
                </div>

                <div class="form-group">
                    <label for="artImage">Upload Image</label>
                    <div class="file-upload">
                        <input type="file" id="artImage" accept="image/*" required>
                        <label for="artImage" class="file-label">
                            <span>📁 Click to select an image or drag and drop</span>
                        </label>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Upload Art</button>
                <div id="uploadStatus" class="upload-status"></div>
            </form>
        </div>
    </section>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-compat.js"></script>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
